<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Transporte | Iniciar sesión</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #0f172a;
        }

        .card {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
        }

        .logo {
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 27px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
        }

        .subtitle {
            margin: 8px 0 24px;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #message {
            min-height: 22px;
            margin-top: 17px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #15803d;
        }

        .credentials {
            margin-top: 25px;
            padding: 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 12px;
            line-height: 1.6;
        }

        .credentials strong {
            display: block;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">🚚</div>

        <h1>XYZ Transporte</h1>
        <p class="subtitle">
            Inicia sesión para acceder al sistema de camiones y conductores.
        </p>

        <form id="loginForm">
            <label for="username">Usuario</label>
            <input id="username" type="text" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button id="loginButton" type="submit">Iniciar sesión</button>
        </form>

        <p id="message" aria-live="polite"></p>

        <div class="credentials">
            <strong>Usuarios de prueba</strong>
            ADMIN: admin / admin123<br>
            SUPERVISOR: supervisor / super123
        </div>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            message.className = "";
            button.disabled = true;
            button.textContent = "Validando...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    throw new Error("Usuario o contraseña incorrectos.");
                }

                const data = await response.json();

                localStorage.setItem("jwtToken", data.token);
                localStorage.setItem("username", username);

                message.textContent = "Inicio de sesión exitoso. Token JWT guardado.";
                message.className = "success";

                console.log("JWT:", data.token);
            } catch (error) {
                message.textContent = error.message;
                message.className = "error";
            } finally {
                button.disabled = false;
                button.textContent = "Iniciar sesión";
            }
        });
    </script>
</body>
</html>
